# Rebuilds the TimeSilhouette gallery whenever photos are added or removed.
name: Build TimeSilhouette gallery

on:
  push:
    branches: [main]
    paths:
      - "timesilhouette/photos/**"
      - "timesilhouette/build.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: timesilhouette
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow pillow-heif

      - run: python timesilhouette/build.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timesilhouette/gallery timesilhouette/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update TimeSilhouette gallery"
          git pull --rebase
          git push
