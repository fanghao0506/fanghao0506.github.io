<style>
  :root {
    --bg: #f4f2ee; --fg: #1c1b19; --mute: #8b877f; --line: #dcd8d0;
    --h: 300px; --gap: 6px; --pad: clamp(6px, 2.5vw, 40px);
    --serif: "Cormorant Garamond", "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0c0c0c; --fg: #ebe7e0; --mute: #7a766f; --line: #2a2926; }
  }
  @media (max-width: 1100px) { :root { --h: 230px; } }
  @media (max-width: 640px)  { :root { --h: 140px; --gap: 3px; --pad: 3px; } }
  @media (min-width: 1700px) { :root { --h: 380px; --gap: 8px; } }

  *, *::before, *::after { box-sizing: border-box; }
  html { background: var(--bg); color: var(--fg); -webkit-text-size-adjust: 100%; }
  html:has(dialog[open]) { overflow: hidden; }
  body { margin: 0; font: 13px/1.5 var(--sans); }
  a { color: inherit; text-decoration: none; }

  .top {
    display: flex; justify-content: space-between; align-items: center;
    padding: 22px clamp(16px, 2.5vw, 40px);
    font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--mute);
  }
  .top a { transition: color .3s; }
  .top a:hover { color: var(--fg); }

  .intro { text-align: center; padding: clamp(56px, 14vh, 150px) 16px clamp(48px, 10vh, 110px); }
  .intro h1 { margin: 0; font-weight: 300; }
  .intro .zh {
    display: block; font: 300 clamp(30px, 4.2vw, 50px)/1.2 "Noto Serif SC", serif;
    letter-spacing: .45em; margin-right: -.45em;
  }
  .intro .en {
    display: block; margin-top: 14px; font: italic 300 clamp(19px, 2vw, 26px)/1 var(--serif);
    letter-spacing: .06em; color: var(--mute);
  }
  .intro p {
    margin: 30px 0 0; font-size: 10.5px; letter-spacing: .32em; text-transform: uppercase; color: var(--mute);
  }
  .intro p::before {
    content: ""; display: block; width: 1px; height: 36px; margin: 0 auto 26px; background: var(--line);
  }
  .js .intro > * { animation: rise 1.2s cubic-bezier(.2, .7, .2, 1) both; }
  .js .intro p { animation-delay: .25s; }

  /* Justified rows: each photo's flex-basis and flex-grow are proportional to its
     aspect ratio, so every photo in a row ends up exactly the same height. */
  .grid {
    display: flex; flex-wrap: wrap; align-items: flex-start; gap: var(--gap);
    padding: 0 var(--pad);
  }
  .grid::after { content: ""; flex: 1e6 1 0; }
  .grid a {
    flex: var(--ar) 1 calc(var(--ar) * var(--h)); min-width: 0;
    aspect-ratio: var(--ar); overflow: hidden; background: var(--c);
    transition: opacity .5s;
  }
  .grid img {
    display: block; width: 100%; height: 100%; object-fit: cover;
    transition: opacity .8s ease, transform 1.2s cubic-bezier(.2, .7, .2, 1);
  }
  .js .grid img:not(.on) { opacity: 0; }
  @media (hover: hover) {
    .grid:has(a:hover) a:not(:hover) { opacity: .62; }
    .grid a:hover img { transform: scale(1.025); }
    .grid a { cursor: zoom-in; }
  }

  footer {
    padding: clamp(60px, 12vh, 120px) 16px 40px; text-align: center;
    font: italic 300 16px var(--serif); color: var(--mute); letter-spacing: .04em;
  }
  footer a { border-bottom: 1px solid var(--line); transition: color .3s; }
  footer a:hover { color: var(--fg); }

  /* Viewer */
  .lb {
    width: 100vw; height: 100dvh; max-width: none; max-height: none; margin: 0; padding: 0;
    border: 0; background: #080808; color: #d8d4cc; overflow: hidden;
    touch-action: pinch-zoom;
  }
  .lb[open] { display: grid; place-items: center; animation: fade .35s ease; }
  .lb::backdrop { background: #080808; }
  .lb-img {
    max-width: calc(100vw - 160px); max-height: calc(100dvh - 120px);
    object-fit: contain; user-select: none; -webkit-user-drag: none;
  }
  .lb button {
    position: absolute; border: 0; padding: 0; background: none; color: inherit; cursor: pointer;
    opacity: .55; transition: opacity .3s;
  }
  .lb button:hover, .lb button:focus-visible { opacity: 1; }
  .lb:focus, .lb button:focus { outline: none; }
  .lb-prev, .lb-next { top: 0; bottom: 0; width: 25vw; display: flex; align-items: center; }
  .lb .lb-prev { left: 0; padding-left: 26px; }
  .lb .lb-next { right: 0; justify-content: flex-end; padding-right: 26px; }
  .lb-close { top: 18px; right: 22px; width: 40px; height: 40px; display: grid; place-items: center; }
  .lb svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.2; }
  .lb-meta {
    position: absolute; left: 30px; right: 30px; bottom: 22px; display: flex; justify-content: space-between;
    gap: 24px; font-size: 11px; letter-spacing: .14em; color: #8a867e; pointer-events: none;
  }
  .lb-n { font-variant-numeric: tabular-nums; }
  .lb.idle button, .lb.idle .lb-meta { opacity: 0; }
  .lb.idle { cursor: none; }
  .lb-meta { transition: opacity .4s; }

  @media (max-width: 640px) {
    .lb-img { max-width: 100vw; max-height: calc(100dvh - 110px); }
    .lb-prev, .lb-next { display: none; }
    .lb-meta { left: 16px; right: 16px; flex-direction: column; gap: 4px; text-align: center; }
    .lb-close { top: 8px; right: 8px; }
  }

  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  @keyframes fade { from { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

<dialog class="lb" aria-label="Photo viewer" autofocus>
  <img class="lb-img" alt="">
  <button class="lb-prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8"/></svg></button>
  <button class="lb-next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="m9 4 8 8-8 8"/></svg></button>
  <button class="lb-close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></svg></button>
  <div class="lb-meta"><span class="lb-n"></span><span class="lb-exif"></span></div>
</dialog>

<script>
(() => {
  const items = [...document.querySelectorAll(".grid a")];
  const len = items.length;
  const pad = n => String(n).padStart(String(len).length, "0");

  // Fade each thumbnail in once it has decoded.
  for (const a of items) {
    const img = a.firstElementChild;
    const on = () => img.classList.add("on");
    if (img.complete) on();
    else { img.addEventListener("load", on, { once: true }); img.addEventListener("error", on, { once: true }); }
  }

  const lb = document.querySelector(".lb");
  const view = lb.querySelector(".lb-img");
  const num = lb.querySelector(".lb-n");
  const exif = lb.querySelector(".lb-exif");
  let cur = -1, pushed = false, idleTimer;

  const preload = i => { new Image().src = items[(i + len) % len].href; };

  function show(i) {
    cur = (i + len) % len;
    const a = items[cur];
    view.src = a.firstElementChild.currentSrc || a.firstElementChild.src;  // grid copy is already cached: show it instantly
    const big = new Image();
    big.onload = () => { if (items[cur] === a) view.src = big.src; };
    big.src = a.href;
    view.animate([{ opacity: .3 }, { opacity: 1 }], { duration: 280, easing: "ease-out" });
    num.textContent = `${pad(cur + 1)} / ${len}`;
    exif.textContent = [a.dataset.exif, a.dataset.date].filter(Boolean).join("  ·  ");
    history.replaceState(null, "", "#" + a.id);
    preload(cur + 1); preload(cur - 1);
  }

  function open(i, push) {
    if (!lb.open) {
      lb.showModal();
      if (push) { history.pushState(null, "", "#" + items[i].id); pushed = true; }
      wake();
    }
    show(i);
  }

  function close() {
    if (!lb.open) return;
    lb.close();
    items[cur].focus({ preventScroll: true });
    if (pushed) { pushed = false; history.back(); }
    else history.replaceState(null, "", location.pathname + location.search);
  }

  function wake() {
    lb.classList.remove("idle");
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => lb.classList.add("idle"), 2500);
  }

  document.querySelector(".grid").addEventListener("click", e => {
    const a = e.target.closest("a");
    if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
    e.preventDefault();
    open(items.indexOf(a), true);
  });

  lb.querySelector(".lb-prev").onclick = () => show(cur - 1);
  lb.querySelector(".lb-next").onclick = () => show(cur + 1);
  lb.querySelector(".lb-close").onclick = close;
  lb.addEventListener("click", e => { if (e.target === lb) close(); });
  lb.addEventListener("cancel", e => { e.preventDefault(); close(); });
  lb.addEventListener("mousemove", wake);
  lb.addEventListener("keydown", e => {
    wake();
    if (e.key === "ArrowRight") show(cur + 1);
    else if (e.key === "ArrowLeft") show(cur - 1);
  });

  let x0 = null;
  lb.addEventListener("pointerdown", e => { if (e.pointerType !== "mouse" && e.isPrimary) x0 = e.clientX; });
  lb.addEventListener("pointerup", e => {
    if (x0 === null || visualViewport.scale > 1) return;
    const dx = e.clientX - x0; x0 = null;
    if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1));
    else if (e.target === view || e.target === lb) lb.classList.toggle("idle");
  });

  window.addEventListener("popstate", () => {
    const i = items.findIndex(a => "#" + a.id === location.hash);
    if (i < 0) { pushed = false; if (lb.open) lb.close(); }
    else open(i, false);
  });

  const start = items.findIndex(a => "#" + a.id === location.hash);
  if (start >= 0) open(start, false);
})();
</script>
