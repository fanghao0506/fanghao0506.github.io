<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的收藏 · Collection — Hao Fang</title>
<meta name="description" content="Hao Fang's collection of useful tools and websites.">
<link rel="icon" href="../images/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300&text=%E6%88%91%E7%9A%84%E6%94%B6%E8%97%8F&display=swap">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-G5HK5SHKZ7"></script>

  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag("js", new Date());
  gtag("config", "G-G5HK5SHKZ7");

<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --fg: #1d1c1a; --mute: #8a867e; --line: #e4e1da;
    --hover: #fbfaf8; --accent: #1d1c1a; --ring: rgba(29, 28, 26, .14);
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f0f; --card: #171716; --fg: #ebe7e0; --mute: #7d796f; --line: #262523;
      --hover: #1d1d1b; --accent: #ebe7e0; --ring: rgba(235, 231, 224, .16);
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { background: var(--bg); color: var(--fg); -webkit-text-size-adjust: 100%; }
  body { margin: 0; font: 14px/1.5 var(--sans); }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 40px); }

  .top {
    display: flex; justify-content: space-between; align-items: center; padding: 22px 0;
    font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--mute);
  }
  .top a, .top button { transition: color .3s; }
  .top a:hover, .top button:hover { color: var(--fg); }
  .lang { border: 0; background: none; padding: 0; cursor: pointer; letter-spacing: inherit; }

  .intro { text-align: center; padding: clamp(36px, 9vh, 90px) 0 clamp(28px, 5vh, 48px); }
  h1 { margin: 0; font-weight: 300; }
  h1 .zh { display: block; font: 300 clamp(28px, 4vw, 42px)/1.2 "Noto Serif SC", serif; letter-spacing: .4em; margin-right: -.4em; }
  h1 .en { display: block; margin-top: 10px; font: italic 300 clamp(18px, 2vw, 23px)/1 "Cormorant Garamond", serif; color: var(--mute); letter-spacing: .05em; }

  /* Search */
  .search { position: sticky; top: 0; z-index: 5; padding: 12px 0 0; background: var(--bg); }
  .box {
    display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 8px 0 18px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 0 0 12px var(--bg);
    transition: border-color .2s, box-shadow .2s;
  }
  .box:focus-within { border-color: var(--mute); box-shadow: 0 0 0 4px var(--ring), 0 0 0 12px var(--bg); }
  .box svg { flex: none; width: 18px; height: 18px; fill: none; stroke: var(--mute); stroke-width: 1.6; }
  .box input {
    flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none;
    font: inherit; font-size: 16px; color: var(--fg);
  }
  .box input::placeholder { color: var(--mute); }
  .engines { display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--bg); }
  .engines button {
    border: 0; background: none; padding: 5px 10px; border-radius: 8px; cursor: pointer;
    font-size: 12px; color: var(--mute); transition: background .2s, color .2s;
  }
  .engines button[aria-pressed="true"] { background: var(--card); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .hint { margin: 8px 4px 0; font-size: 12px; color: var(--mute); min-height: 18px; }
  kbd {
    font: 11px var(--sans); padding: 1px 5px; border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 4px; background: var(--card);
  }

  /* Bookmarks */
  section { margin-top: 34px; }
  section[hidden] { display: none; }
  h2 {
    display: flex; align-items: baseline; gap: 10px; margin: 0 0 12px; padding-left: 2px;
    font-size: 11px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--mute);
  }
  h2 small { font-size: 11px; letter-spacing: 0; opacity: .7; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
  .card {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-width: 0;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; outline: 0;
    transition: border-color .2s, background .2s, transform .2s;
  }
  .card:hover, .card:focus-visible { background: var(--hover); border-color: var(--mute); }
  .card:focus-visible { box-shadow: 0 0 0 4px var(--ring); }
  .card:active { transform: scale(.985); }
  .card[hidden] { display: none; }
  .ico {
    position: relative; flex: none; display: grid; place-items: center; width: 32px; height: 32px;
    border-radius: 8px; background: var(--bg); font-size: 13px; font-weight: 600; color: var(--mute);
  }
  .ico img { position: absolute; inset: 6px; width: 20px; height: 20px; opacity: 0; transition: opacity .3s; }
  .ico img.on { opacity: 1; }
  .ico.on { color: transparent; }
  .txt { min-width: 0; }
  .name, .host { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .name { font-size: 14px; }
  .host { font-size: 12px; color: var(--mute); }
  mark { background: none; color: inherit; text-decoration: underline; text-decoration-color: var(--mute); text-underline-offset: 3px; }

  footer { padding: 70px 0 40px; text-align: center; font: italic 300 16px "Cormorant Garamond", serif; color: var(--mute); }
  footer a { border-bottom: 1px solid var(--line); }
  footer a:hover { color: var(--fg); }

  @media (max-width: 560px) {
    .grid { grid-template-columns: 1fr 1fr; gap: 6px; }
    .card { padding: 10px; gap: 10px; }
    .host { display: none; }
    .engines button { padding: 5px 7px; }
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a href="../index.html">Hao Fang</a>
    <button class="lang" type="button" aria-label="Switch language"></button>
  </header>

  <div class="intro">
    <h1><span class="zh">我的收藏</span><span class="en">Collection</span></h1>
  </div>

  <form class="search" role="search">
    <label class="box">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" name="q" autocomplete="off" spellcheck="false" enterkeyhint="search">
      <span class="engines" role="group"></span>
    </label>
  </form>
  <p class="hint"></p>

  <main></main>

  <footer>© Hao Fang &nbsp;·&nbsp; <a href="../index.html">Homepage</a></footer>
</div>

<script src="links.js"></script>
<script>
(() => {
  const ENGINES = [
    { id: "google", name: "Google", url: "https://www.google.com/search?q=" },
    { id: "baidu", name: "百度", en: "Baidu", url: "https://www.baidu.com/s?wd=" },
    { id: "scholar", name: "学术", en: "Scholar", url: "https://scholar.google.com/scholar?q=" },
  ];
  const T = {
    zh: { placeholder: "筛选收藏或搜索网页", lang: "EN", hint: "按 <kbd>/</kbd> 聚焦 · <kbd>↓</kbd> 选择收藏 · <kbd>Enter</kbd> 用 {e} 搜索",
          none: "没有匹配的收藏 — 按 <kbd>Enter</kbd> 用 {e} 搜索「{q}」" },
    en: { placeholder: "Filter, or search the web", lang: "中文",
          hint: "<kbd>/</kbd> to focus · <kbd>↓</kbd> to pick a bookmark · <kbd>Enter</kbd> to search {e}",
          none: "No bookmarks match — press <kbd>Enter</kbd> to search {e} for “{q}”" },
  };
  const store = {
    get: k => { try { return localStorage.getItem(k); } catch { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  };

  let lang = store.get("tools.lang") || (navigator.language.startsWith("zh") ? "zh" : "en");
  let engine = ENGINES.find(e => e.id === store.get("tools.engine")) || ENGINES[0];

  const main = document.querySelector("main");
  const form = document.querySelector(".search");
  const input = form.q;
  const hint = document.querySelector(".hint");
  const enginesEl = form.querySelector(".engines");
  const langBtn = document.querySelector(".lang");
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const hostOf = url => { try { return new URL(url).hostname.replace(/^www\./, ""); } catch { return ""; } };

  // Build every card once; filtering only toggles `hidden`.
  const cards = [];
  main.innerHTML = COLLECTION.map((cat, ci) => `
    <section data-c="${ci}">
      <h2><span data-zh="${esc(cat.zh)}" data-en="${esc(cat.en)}"></span><small>${cat.links.length}</small></h2>
      <div class="grid">${cat.links.map(l => {
        const host = hostOf(l.url);
        const ext = !!host;
        return `<a class="card" href="${esc(l.url)}"${l.tags ? ` title="${esc(l.tags)}"` : ""}${ext ? ' target="_blank" rel="noopener"' : ""}>
          <span class="ico">${esc((l.en || l.zh)[0].toUpperCase())}${ext
            ? `<img src="https://www.google.com/s2/favicons?domain=${host}&sz=64" alt="" loading="lazy">` : ""}</span>
          <span class="txt"><span class="name"></span><span class="host">${ext ? esc(host) : "fanghao0506.github.io"}</span></span>
        </a>`;
      }).join("")}</div>
    </section>`).join("");

  const sections = [...main.querySelectorAll("section")];
  sections.forEach((sec, ci) => {
    [...sec.querySelectorAll(".card")].forEach((el, li) => {
      const l = COLLECTION[ci].links[li];
      cards.push({ el, sec, l, name: el.querySelector(".name"),
                   hay: `${l.zh} ${l.en} ${l.tags || ""} ${hostOf(l.url)} ${COLLECTION[ci].zh} ${COLLECTION[ci].en}`.toLowerCase() });
    });
  });

  main.querySelectorAll(".ico img").forEach(img => {
    img.onload = () => { if (img.naturalWidth > 16) { img.classList.add("on"); img.parentNode.classList.add("on"); } else img.remove(); };
    img.onerror = () => img.remove();
  });

  function label(l) { return lang === "zh" ? l.zh : l.en; }

  function highlight(text, q) {
    const i = q ? text.toLowerCase().indexOf(q) : -1;
    return i < 0 ? esc(text) : esc(text.slice(0, i)) + "<mark>" + esc(text.slice(i, i + q.length)) + "</mark>" + esc(text.slice(i + q.length));
  }

  function filter() {
    const q = input.value.trim().toLowerCase();
    let shown = 0;
    for (const c of cards) {
      const hit = !q || c.hay.includes(q);
      c.el.hidden = !hit;
      if (hit) shown++;
      c.name.innerHTML = highlight(label(c.l), q);
    }
    for (const sec of sections) sec.hidden = !sec.querySelector(".card:not([hidden])");
    const t = T[lang], e = esc(lang === "zh" ? engine.name : engine.en || engine.name);
    hint.innerHTML = (q && !shown ? t.none : t.hint).replace("{e}", e).replace("{q}", esc(input.value.trim()));
  }

  function render() {
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    langBtn.textContent = T[lang].lang;
    input.placeholder = T[lang].placeholder;
    main.querySelectorAll("h2 [data-zh]").forEach(s => { s.textContent = s.dataset[lang]; });
    enginesEl.innerHTML = ENGINES.map(e =>
      `<button type="button" data-id="${e.id}" aria-pressed="${e === engine}">${lang === "zh" ? e.name : e.en || e.name}</button>`).join("");
    filter();
  }

  langBtn.onclick = () => { lang = lang === "zh" ? "en" : "zh"; store.set("tools.lang", lang); render(); };
  enginesEl.onclick = e => {
    const b = e.target.closest("button");
    if (!b) return;
    engine = ENGINES.find(x => x.id === b.dataset.id);
    store.set("tools.engine", engine.id);
    render();
    input.focus();
  };
  input.addEventListener("input", filter);
  form.addEventListener("submit", e => {
    e.preventDefault();
    const q = input.value.trim();
    if (q) location.href = engine.url + encodeURIComponent(q);
  });

  const visible = () => cards.filter(c => !c.el.hidden).map(c => c.el);
  document.addEventListener("keydown", e => {
    const inInput = e.target === input;
    if (e.key === "/" && !inInput) { e.preventDefault(); input.focus(); input.select(); return; }
    if (e.key === "Escape" && inInput) { input.value = ""; filter(); return; }
    const list = visible(), i = list.indexOf(document.activeElement);
    if (inInput && e.key === "ArrowDown" && list.length) { e.preventDefault(); list[0].focus(); return; }
    if (i < 0) return;
    if (e.key === "ArrowDown" || e.key === "ArrowRight") { e.preventDefault(); list[Math.min(i + 1, list.length - 1)].focus(); }
    else if (e.key === "ArrowUp" || e.key === "ArrowLeft") { e.preventDefault(); (i ? list[i - 1] : input).focus(); }
  });

  render();
})();
</script>
</body>
</html>
