<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>To 忻</title>

  <base href="https://cdn.jsdelivr.net/gh/fanghao0506/fanghao0506.github.io@main/qixi-letter/">

  <!-- <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg-1:#fff7fb;      /* 主背景浅粉 */
      --bg-2:#fdf8ff;      /* 主背景浅紫 */
      --ink:#2b2b2b;       /* 文字颜色 */
      --accent:#d64a6b;    /* 玫瑰红 */
      --accent-2:#f2a6b3;  /* 柔粉 */
      --card:#ffffffee;    /* 卡片背景（半透明白） */
      --border:#f3c7d5;    /* 边框色 */
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      color:var(--ink);
      font: 17px/1.9 "Noto Serif SC","ZCOOL XiaoWei","STSong","Songti SC",serif;
      background:
        radial-gradient(1200px 800px at 10% 10%, rgba(253, 219, 231, .45), transparent 50%),
        radial-gradient(1000px 600px at 90% 90%, rgba(238, 223, 255, .45), transparent 50%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
    }
    .paper-texture{
      position:fixed; inset:0; pointer-events:none; opacity:.2;
      background:
        repeating-linear-gradient(0deg, rgba(0,0,0,.03) 0px, rgba(0,0,0,.03) 1px, transparent 2px);
      mix-blend-mode:multiply;
    }
    main{
      min-height:100dvh; display:grid; place-items:center; padding:6vh 18px;
    }
    .wrap{ width:min(920px, 92vw); position:relative; }

    /* 顶部标题 */
    .title{
      text-align:center; margin-bottom:22px; letter-spacing:.2em; color:#7b3e57;
      font-weight:600; font-size:14px; text-transform:uppercase;
    }

    .letter{
      position:relative; padding:44px clamp(22px, 5vw, 56px);
      background:var(--card);
      border-radius:24px; border:1px solid var(--border);
      box-shadow:0 20px 50px rgba(214,74,107,.12), 0 6px 18px rgba(0,0,0,.05);
      backdrop-filter: blur(4px);
    }
    .letter:before, .letter:after{
      content:""; position:absolute; inset:10px; border-radius:20px; pointer-events:none;
      border:1px dashed #f0b8c7;
    }

    /* 装饰花纹（SVG） */
    .flourish{
      position:absolute; left:50%; transform:translateX(-50%);
      width:160px; opacity:.6; fill:none; stroke:#e59fb1; top:-28px;
    }
    .flourish.bottom{ top:auto; bottom:-28px; transform:translateX(-50%) rotate(180deg); }

    .quote{
      font-size: clamp(22px, 3.2vw, 30px);
      line-height:1.75; text-align:center; margin:0 0 10px; color:#492a35;
    }

    .content{ margin-top:8px; }
    .content p{ margin: 0 0 1em; text-indent: 2em; }
    .content strong{ color:var(--accent); font-weight:600 }

    .sig{
      margin-top:22px; text-align:right; color:#663444;
    }

    /* ======================== 图片展示区（更灵活的尺寸支持） ======================== */
    /* 方案一：瀑布流（masonry）布局，自动根据图片原始纵横比排版 */
    .gallery{
      margin-top:34px;
      column-width: 260px;     /* 列的目标宽度，页面会自动算列数 */
      column-gap: 12px;        /* 列间距 */
    }
    .tile{                 /* 每张图片所在容器 */
      display:inline-block;   /* 关键：让元素在多列中正确流动 */
      width:100%;
      margin: 0 0 12px;       /* 行间距 */
      break-inside: avoid;    /* 避免被列分割 */
      border-radius:16px; border:1px solid #f1ccda; background:#fff; overflow:hidden;
    }
    .tile img{
      width:100%; height:auto; display:block;  /* 核心：不强制高宽比，自动等比缩放 */
      transition: transform .45s ease;
    }
    .tile:hover img{ transform: scale(1.03); }

    /* 小屏优化：列宽更窄，列数自动增减 */
    @media (max-width: 740px){
      .gallery{ column-width: 180px; column-gap:10px; }
      .tile{ margin-bottom:10px; }
    }

    /* 打印样式 */
    @media print{
      body{ background:white; }
      .paper-texture, .title, .gallery{ display:none !important; }
      .letter{ box-shadow:none; border:1px solid #ddd; }
      .letter:before, .letter:after{ display:none; }
    }
  </style>
</head>
<body>
  <div class="paper-texture" aria-hidden="true"></div>
  <main>
    <div class="wrap">
      <div class="title">To 忻</div>

      <svg class="flourish" viewBox="0 0 200 40" aria-hidden="true">
        <path d="M5,20 Q40,5 75,20 T145,20 T195,20" stroke-width="1.5" />
      </svg>

      <article class="letter" aria-label="情书">
        <h1 class="quote">愿此刻的花与信，都替我跨过距离，落到你怀里。</h1>
        <div class="content">
          <p>宝贝，七夕快乐！</p>
          <p>今天是我们在一起之后的第一个七夕，也是我第一次真正意义上送你鲜花。</p>
          <p>弗洛伊德玫瑰的花语是：<strong>深情、炽热、永恒的爱</strong>。正如此刻，我对你不绝的思念与爱，不因距离而动摇。</p>
          <p>愿每一片花瓣都替我吻你一次，直到有一天，我能亲手将花递到你怀里，然后，我们再不分开。</p>
        </div>
        <div class="sig">—— Hao</div>
      </article>

      <svg class="flourish bottom" viewBox="0 0 200 40" aria-hidden="true">
        <path d="M5,20 Q40,5 75,20 T145,20 T195,20" stroke-width="1.5" />
      </svg>

      <!-- 使用说明：
        1) 现在相册采用“瀑布流”布局：可直接放任意尺寸的图片（横/竖/方）。
        2) 把图片放到 ./images/，并按自己喜好命名，比如 img1.jpg, img2.jpg ... 即可。
        3) 想固定顺序就按想要的顺序写在下面；可随意增删 <figure> 块。
      -->
      <section class="gallery" aria-label="照片相册">
        <figure class="tile"><img src="images/img1.jpg" alt="照片1"></figure>
        <figure class="tile"><img src="images/img7.png" alt="照片7"></figure>
        <figure class="tile"><img src="images/img4.jpg" alt="照片4"></figure>
        <figure class="tile"><img src="images/img2.jpg" alt="照片2"></figure>
        <figure class="tile"><img src="images/img3.jpg" alt="照片3"></figure>
        <figure class="tile"><img src="images/img5.jpg" alt="照片5"></figure>
        <figure class="tile"><img src="images/img6.jpg" alt="照片6"></figure>
        <figure class="tile"><img src="images/img8.jpg" alt="照片8"></figure>
        <figure class="tile"><img src="images/img9.jpg"  alt="照片9"></figure>
        <figure class="tile"><img src="images/img10.jpg" alt="照片10"></figure>
        <figure class="tile"><img src="images/img11.jpg" alt="照片11"></figure>
        <figure class="tile"><img src="images/img12.jpg" alt="照片12"></figure>
        <figure class="tile"><img src="images/img13.jpg" alt="照片13"></figure>
        <figure class="tile"><img src="images/img14.jpg" alt="照片14"></figure>
        <figure class="tile"><img src="images/img15.jpg" alt="照片15"></figure>
        <figure class="tile"><img src="images/img16.jpg" alt="照片16"></figure>
        <figure class="tile"><img src="images/img17.jpg" alt="照片17"></figure>

      </section>
    </div>
  </main>

  <!-- 简易灯箱脚本：点击图片即可放大，点击蒙层关闭 -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="图片预览">
    <img id="lightboxImg" alt="预览图">
  </div>
  <script>
    const box = document.getElementById('lightbox');
    const boxImg = document.getElementById('lightboxImg');
    document.querySelectorAll('.gallery img').forEach(img => {
      img.addEventListener('click', () => {
        boxImg.src = img.src;
        box.classList.add('open');
      });
    });
    box.addEventListener('click', () => box.classList.remove('open'));
    window.addEventListener('keydown', e => { if(e.key === 'Escape') box.classList.remove('open'); });
  </script>
</body>
</html>
